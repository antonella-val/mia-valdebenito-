<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel | MC TECH</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="img/logo.png" alt="MC TECH">
      <span>Panel de Administración</span>
    </div>
    <nav>
      <a href="index.html">Ver sitio</a>
      <a href="#" id="btn-logout">Cerrar sesión</a>
    </nav>
  </header>

  <section>
    <h2>Consultas recibidas</h2>

    <div style="display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem;">
      <input type="text" id="filtro-texto" placeholder="Buscar por nombre o email..."
        style="flex:1;min-width:220px;padding:.6rem;border:2px solid var(--azul-claro);border-radius:8px;">
      <select id="filtro-estado"
        style="padding:.6rem;border:2px solid var(--azul-claro);border-radius:8px;">
        <option value="">Todas</option>
        <option value="0">No leídas</option>
        <option value="1">Leídas</option>
      </select>
    </div>

    <table class="tabla-consultas">
      <thead>
        <tr>
          <th>ID</th><th>Nombre</th><th>Email</th><th>Asunto</th>
          <th>Fecha</th><th>Estado</th><th>Acción</th>
        </tr>
      </thead>
      <tbody id="cuerpo-tabla">
        <tr><td colspan="7">Cargando...</td></tr>
      </tbody>
    </table>
  </section>

  <div id="modal"
    style="display:none;position:fixed;inset:0;background:rgba(57,88,134,.6);
           align-items:center;justify-content:center;padding:1rem;z-index:100;">
    <div style="background:#fff;border-radius:12px;max-width:600px;width:100%;
                padding:2rem;position:relative;">
      <button id="cerrar-modal"
        style="position:absolute;top:.6rem;right:.8rem;background:none;
               border:none;font-size:1.4rem;cursor:pointer;">✕</button>
      <div id="contenido-modal"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('mc_token');
    if (!token) window.location.href = 'admin.html';

    let consultas = [];

    async function cargar() {
      const res = await fetch('/api/consultas', {
        headers: { 'Authorization': token }
      });
      if (res.status === 401) {
        localStorage.removeItem('mc_token');
        return window.location.href = 'admin.html';
      }
      consultas = await res.json();
      render();
    }

    function render() {
      const texto = document.getElementById('filtro-texto').value.toLowerCase();
      const estadoFiltro = document.getElementById('filtro-estado').value;

      const filtradas = consultas.filter(c => {
        const coincideTexto =
          c.nombre.toLowerCase().includes(texto) ||
          c.email.toLowerCase().includes(texto);
        const coincideEstado =
          estadoFiltro === '' || String(c.leida) === estadoFiltro;
        return coincideTexto && coincideEstado;
      });

      const tbody = document.getElementById('cuerpo-tabla');
      if (filtradas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7">No hay consultas que coincidan.</td></tr>';
        return;
      }
      tbody.innerHTML = filtradas.map(c => `
        <tr data-id="${c.id}">
          <td>${c.id}</td>
          <td>${c.nombre}</td>
          <td>${c.email}</td>
          <td>${c.asunto}</td>
          <td>${new Date(c.fecha).toLocaleString('es-AR')}</td>
          <td>${c.leida
            ? '<span class="badge-leida">Leída</span>'
            : '<span class="badge-noleida">No leída</span>'}</td>
          <td>
            ${c.leida ? '—' :
              `<button class="btn btn-sec" data-marcar="${c.id}"
                style="padding:.3rem .8rem;font-size:.85rem;">Marcar leída</button>`}
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('cuerpo-tabla').addEventListener('click', async (e) => {
      const btnMarcar = e.target.closest('[data-marcar]');
      if (btnMarcar) {
        e.stopPropagation();
        const id = btnMarcar.dataset.marcar;
        await fetch(`/api/consultas/${id}/leida`, {
          method: 'PATCH',
          headers: { 'Authorization': token }
        });
        await cargar();
        return;
      }

      const fila = e.target.closest('tr[data-id]');
      if (fila) abrirDetalle(fila.dataset.id);
    });

    async function abrirDetalle(id) {
      const res = await fetch(`/api/consultas/${id}`, {
        headers: { 'Authorization': token }
      });
      const c = await res.json();
      document.getElementById('contenido-modal').innerHTML = `
        <h2 style="margin-top:0">${c.asunto}</h2>
        <p><strong>De:</strong> ${c.nombre} &lt;${c.email}&gt;</p>
        <p><strong>Teléfono:</strong> ${c.telefono || '—'}</p>
        <p><strong>Fecha:</strong> ${new Date(c.fecha).toLocaleString('es-AR')}</p>
        <hr style="margin:1rem 0;border:none;border-top:1px solid var(--azul-claro)">
        <p style="white-space:pre-wrap">${c.mensaje}</p>
      `;
      document.getElementById('modal').style.display = 'flex';
    }

    document.getElementById('cerrar-modal').addEventListener('click', () => {
      document.getElementById('modal').style.display = 'none';
    });

    document.getElementById('filtro-texto').addEventListener('input', render);
    document.getElementById('filtro-estado').addEventListener('change', render);

    document.getElementById('btn-logout').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/logout', {
        method: 'POST',
        headers: { 'Authorization': token }
      }).catch(() => {});
      localStorage.removeItem('mc_token');
      window.location.href = 'admin.html';
    });

    cargar();
  </script>
</body>
</html>
